name: my_portafolio
description: "Portafolio de Luis Vega, desarrollador de aplicaciones móviles y web."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  image_path: assets/logo_lv.png
  android: true
  ios: true
  web:
    generate: true
    background_color: "#17181F"
    theme_color: "#17181F"
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
